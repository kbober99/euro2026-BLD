<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Euro 2026 — Simulation Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c10;--bg2:#11141a;--bg3:#181c25;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#e8eaf0;--muted:#7a8090;--accent:#00e5a0;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}

.header{border-bottom:1px solid var(--border);padding:28px 40px 22px;text-align:center}
.header h1{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--accent);margin-bottom:6px}
.header h1 span{color:var(--text)}
.header p{color:var(--muted);font-size:13px}

.main{padding:40px;max-width:1200px;margin:0 auto}

.section-title{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:16px}

/* EVENT GRID */
.events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:40px}

.event-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:20px 18px;cursor:pointer;transition:all 0.18s;text-decoration:none;
  display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
}
.event-card::before{
  content:'';position:absolute;inset:0;border-radius:12px;
  background:linear-gradient(135deg,var(--card-color,#00e5a0) 0%,transparent 60%);
  opacity:0;transition:opacity 0.18s;
}
.event-card:hover{border-color:var(--card-color,var(--accent));transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.event-card:hover::before{opacity:0.05}
.event-card.no-data{cursor:default;opacity:0.45}
.event-card.no-data:hover{transform:none;border-color:var(--border)}
.event-card.no-data::before{display:none}

.event-icon{font-size:28px;line-height:1}
.event-name{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text)}
.event-id{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.event-status{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-family:var(--mono);margin-top:2px;
}
.event-status.ready{color:var(--accent)}
.event-status.ready::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.event-status.soon{color:var(--muted)}
.event-status.soon::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block}

footer{text-align:center;padding:24px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);margin-top:40px;font-family:var(--mono)}
</style>
</head>
<body>

<div class="header">
  <h1><span>Euro 2026</span> // Simulation Dashboard</h1>
  <p>WCA European Championship 2026 · Monte Carlo Simulations</p>
</div>

<div class="main">
  <div class="section-title">Wybierz konkurencję</div>
  <div class="events-grid" id="events-grid"></div>
</div>

<footer>Euro 2026 · WCA European Championship · Monte Carlo Simulation Dashboard</footer>

<script>
const EVENTS = [
  { id:'333',    name:'3x3x3',                    icon:'🟧', color:'#ff6b35' },
  { id:'222',    name:'2x2x2',                    icon:'🟦', color:'#4a9eff' },
  { id:'444',    name:'4x4x4',                    icon:'🟩', color:'#00e5a0' },
  { id:'555',    name:'5x5x5',                    icon:'🟥', color:'#ff4d4d' },
  { id:'666',    name:'6x6x6',                    icon:'🟨', color:'#ffd700' },
  { id:'777',    name:'7x7x7',                    icon:'🟪', color:'#a78bfa' },
  { id:'333bf',  name:'3x3x3 Bez Patrzenia',      icon:'👁️', color:'#00e5a0' },
  { id:'333fm',  name:'3x3x3 Najmniej Ruchów',    icon:'✏️', color:'#f472b6' },
  { id:'333oh',  name:'3x3x3 Jedną Ręką',         icon:'🤚', color:'#fb923c' },
  { id:'clock',  name:'Zegar',                    icon:'🕐', color:'#38bdf8' },
  { id:'minx',   name:'Megaminx',                 icon:'⭐', color:'#fbbf24' },
  { id:'pyram',  name:'Pyraminx',                 icon:'🔺', color:'#34d399' },
  { id:'skewb',  name:'Skewb',                    icon:'💠', color:'#818cf8' },
  { id:'sq1',    name:'Square-1',                 icon:'🔷', color:'#60a5fa' },
  { id:'444bf',  name:'4x4x4 Bez Patrzenia',      icon:'👁️', color:'#c084fc' },
  { id:'555bf',  name:'5x5x5 Bez Patrzenia',      icon:'👁️', color:'#e879f9' },
  { id:'333mbf', name:'3x3x3 Multi Bez Patrzenia',icon:'👁️', color:'#f43f5e' },
];

async function checkFile(id){
  try{
    const r=await fetch(`${id}.json`,{method:'HEAD'});
    return r.ok;
  }catch(e){ return false; }
}

async function init(){
  const grid=document.getElementById('events-grid');
  // Check all files in parallel
  const checks=await Promise.all(EVENTS.map(e=>checkFile(e.id)));

  EVENTS.forEach((ev,i)=>{
    const ready=checks[i];
    const card=document.createElement(ready?'a':'div');
    if(ready) card.href=`dashboard.html?event=${ev.id}`;
    card.className='event-card'+(ready?'':' no-data');
    card.style.setProperty('--card-color', ev.color);
    card.innerHTML=`
      <div class="event-icon">${ev.icon}</div>
      <div>
        <div class="event-name">${ev.name}</div>
        <div class="event-id">${ev.id}</div>
      </div>
      <div class="event-status ${ready?'ready':'soon'}">${ready?'Dane dostępne':'Brak danych'}</div>`;
    grid.appendChild(card);
  });
}

init();
</script>
</body>
</html>
